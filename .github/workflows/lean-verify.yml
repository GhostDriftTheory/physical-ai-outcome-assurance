name: Lean verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Lean source
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Verify Lean source
        shell: bash
        run: |
          set -euo pipefail

          echo "== Lean version =="
          lean --version

          echo "== Check proof placeholders =="
          if grep -nE '(^|[^A-Za-z0-9_])(sorry|admit)([^A-Za-z0-9_]|$)' PhysicalAIPublicRealization.lean; then
            echo "ERROR: proof placeholder found"
            exit 1
          fi

          echo "== Lean kernel verification =="
          lean PhysicalAIPublicRealization.lean 2>&1 | tee lean-output.txt

          echo "== Check sorryAx =="
          if grep -q 'sorryAx' lean-output.txt; then
            echo "ERROR: sorryAx dependency found"
            exit 1
          fi

          echo "Lean verification completed successfully."
