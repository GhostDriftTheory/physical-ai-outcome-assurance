name: Lean verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Lean source
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain install "$(cat lean-toolchain)"
          lean --version

      - name: Verify Lean source
        shell: bash
        run: |
          set -euo pipefail

          FILE="PhysicalAIPublicRealization.lean"

          echo "== Check proof placeholders =="
          if grep -nE '(^|[^A-Za-z0-9_])(sorry|admit)([^A-Za-z0-9_]|$)' "$FILE"; then
            echo "ERROR: proof placeholder found"
            exit 1
          fi

          echo "== Lean kernel verification =="
          lean "$FILE" 2>&1 | tee lean-output.txt

          echo "== Check sorryAx =="
          if grep -q 'sorryAx' lean-output.txt; then
            echo "ERROR: sorryAx dependency found"
            exit 1
          fi

          echo "Verification completed successfully."
